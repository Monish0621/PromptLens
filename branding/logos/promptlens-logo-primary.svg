<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <linearGradient id="pl-pri-frame-grad-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pl-pri-lens-grad-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pl-pri-word-grad-v2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D8F6" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Container Box (#0F172A) -->
  <rect width="540" height="140" rx="16" fill="#0F172A" />

  <!-- Focus Frame Symbol (Left Positioned) -->
  <g transform="translate(28, 26)">
    <!-- Corner Brackets -->
    <path d="M 20 32 V 24 C 20 21.239 22.239 19 25 19 H 33" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 67 19 H 75 C 77.761 19 80 21.239 80 24 V 32" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 80 68 V 76 C 80 78.761 77.761 81 75 81 H 67" stroke="url(#pl-pri-frame-grad-v2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 81 H 25 C 22.239 81 20 78.761 20 76 V 68" stroke="url(#pl-pri-frame-grad-v2)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Simplified Lens -->
    <circle cx="50" cy="50" r="16" stroke="url(#pl-pri-lens-grad-v2)" stroke-width="4" fill="none" />
    <circle cx="50" cy="50" r="10" fill="#1E1B4B" />
    <circle cx="53.5" cy="46.5" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography Block (Right Positioned) -->
  <g transform="translate(136, 0)">
    <!-- Wordmark -->
    <text x="0" y="70" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#FFFFFF">Prompt<tspan fill="url(#pl-pri-word-grad-v2)">Lens</tspan></text>
    
    <!-- Tagline -->
    <text x="2" y="98" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2" fill="#94A3B8">Capture. Understand. Prompt.</text>
